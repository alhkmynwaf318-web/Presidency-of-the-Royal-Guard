<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رئاسة الحرس الملكي KR</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>موقع رئاسة الحرس الملكي KR</h1>
            <p>الموقع الرسمي لرئاسة الحرس الملكي في سيرفر KR</p>
        </header>

        <div class="main-buttons">
            <a href="#" class="btn btn-submit">تقديم</a>
            <a href="#" class="btn btn-law">لائحة رئاسة الحرس الملكي</a>
            <a href="#" class="btn btn-rank">طلب ترقية</a>
        </div>

        <div class="stats-cards">
            <div class="card">
                <i class="fa-solid fa-users-gear"></i>
                <h3>عدد الإدارة</h3>
                <p class="count">3</p>
            </div>
            <div class="card">
                <i class="fa-solid fa-person-military-to-person"></i>
                <h3>عدد أعضاء الدورة</h3>
                <p class="count">0</p> </div>
            <div class="card">
                <i class="fa-solid fa-eye"></i>
                <h3>زوار الموقع</h3>
                <p class="count">1</p>
            </div>
        </div>

        <div class="image-section">
            <img src="military_image.jpg" alt="الحرس الملكي">
        </div>
    </div>

</body>
</html>
