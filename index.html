<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة رئاسة الحرس الملكي | KR</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
</head>
<body>

    <div id="particles-js"></div>

    <div class="main-container">
        <header data-aos="fade-down" data-aos-duration="1000">
            <div class="top-logo">
                <i class="fa-solid fa-crown"></i>
            </div>
            <h1>بوابة رئاسة الحرس الملكي</h1>
            <h2>نظام شؤون الدورة</h2>
            <p class="brand-motto">RESPECT FIRST</p>
        </header>

        <section class="leadership-section" data-aos="zoom-in" data-aos-delay="200">
            <h3>القيادة</h3>
            <div class="leaders-grid">
                <div class="leader-card">
                    <div class="leader-icon"><i class="fa-solid fa-user-shield"></i></div>
                    <p class="role">رئيس رئاسة الحرس الملكي</p>
                    <p class="name">نواف الحكمي</p>
                    <div class="discord-id">
                        <i class="fa-brands fa-discord"></i> nawaf8203
                    </div>
                </div>
            </div>
        </section>

        <nav class="action-buttons">
            <a href="#" class="nav-item" data-aos="fade-right" data-aos-delay="400">
                <i class="fa-solid fa-paper-plane"></i> تقديم
            </a>
            <a href="#" class="nav-item" data-aos="fade-right" data-aos-delay="500">
                <i class="fa-solid fa-scroll"></i> لائحة رئاسة الحرس الملكي
            </a>
            <a href="#" class="nav-item" data-aos="fade-right" data-aos-delay="600">
                <i class="fa-solid fa-medal"></i> طلب ترقية
            </a>
        </nav>

        <div class="stats-bar" data-aos="fade-up" data-aos-delay="800">
            <div class="stat-item">
                <span class="num">3</span>
                <span class="label">عدد الإدارة</span>
            </div>
            <div class="stat-item">
                <span class="num">0</span>
                <span class="label">أعضاء الدورة</span>
            </div>
            <div class="stat-item">
                <span class="num">1,250</span>
                <span class="label">زوار الموقع</span>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        // تشغيل أنميشن العناصر
        AOS.init({
            once: true // الحركة تحدث مرة واحدة فقط عند التحميل
        });

        // تشغيل خلفية النقاط المتحركة
        particlesJS("particles-js", {
            "particles": {
                "number": { "value": 70 },
                "color": { "value": "#c4a36f" },
                "shape": { "type": "circle" },
                "opacity": { "value": 0.5 },
                "size": { "value": 2 },
                "line_linked": { "enable": true, "distance": 150, "color": "#c4a36f", "opacity": 0.2, "width": 1 },
                "move": { "enable": true, "speed": 1 }
            }
        });
    </script>
</body>
</html>
